name: Changelog Check

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  no-todo:
    name: No TODO in changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog descriptions for TODO
        run: |
          FOUND=0
          FILES=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'content/changelog/*.json')

          if [ -z "$FILES" ]; then
            echo "チェック対象の changelog ファイルはありません。"
            exit 1
          fi

          for f in $FILES; do
            STATUS=0
            jq -e '.description | contains("TODO")' "$f" > /dev/null || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "::error file=$f::説明が TODO のままです。マージ前に内容を記入してください。"
              FOUND=1
            elif [ "$STATUS" -ne 1 ]; then
              echo "::error file=$f::JSON が不正か、description が文字列ではありません。"
              FOUND=1
            fi
          done
          exit "$FOUND"
